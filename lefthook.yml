pre-commit:
  parallel: true
  commands:
    jsonnetfmt:
      glob: "**/*.{jsonnet,libsonnet}"
      stage_fixed: true
      run: jsonnetfmt -i {staged_files}
    prettier:
      glob: "**/*.{json,yml,yaml,toml}"
      stage_fixed: true
      run: npx prettier --write {staged_files}
    stylua:
      glob: "**/*.lua"
      stage_fixed: true
      run: npx @johnnymorganz/stylua-bin --config-path ./stylua.toml {staged_files}
